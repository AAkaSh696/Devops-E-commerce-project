name: Secrets Scan

on:
    workflow_call:
    workflow_dispatch:
    push:
        branches: [main]

jobs:
    secrets-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                 fetch-depth: 0  # Saare commits check karega

            - name: Run gitleaks Scanner
              uses: gitleaks/gitleaks-action@v3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # don't have to create it , github manage it