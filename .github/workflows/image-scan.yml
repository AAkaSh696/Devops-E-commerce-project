name: Image Scanner

on: 
    workflow_call:
    workflow_dispatch:
    push:
        branches: [main]

jobs:

  build-and-push:
      runs-on: ubuntu-latest
      steps:
          - name: Code Checkout
            uses: actions/checkout@v4

          - name: Login to Docker Hub
            uses: docker/login-action@v3
            with:
              username: ${{ vars.DOCKERHUB_USER}}
              password: ${{ secrets.DOCKERHUB_TOKEN}}

          - name: Build and Push to Docker hub
            uses: docker/build-push-action@v6
            with:
              context: .
              push: true
              tags: ${{ vars.DOCKERHUB_USER}}/e-commerce-app:${{ github.sha}}

  image-scanner:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
            username: ${{ vars.DOCKERHUB_USER}}
            password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
            image-ref: ${{ vars.DOCKERHUB_USER}}/e-commerce-app:${{ github.sha}}
            exit-code: '1'
            severity: 'CRITICAL'
            trivyignores: .trivyignore