name: Docker Build and Push

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Main Application
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USER }}/e-commerce-app:${{ github.sha }}

      - name: Build and Push Migration
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile.migration
          push: true
          tags: ${{ vars.DOCKERHUB_USER }}/e-commerce-migration:${{ github.sha }}