apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: easyshop
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/AAkaSh696/Devops-E-commerce-project.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: easyshop

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true