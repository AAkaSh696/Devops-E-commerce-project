apiVersion: batch/v1
kind: Job
metadata:
  generateName: db-migration-
  namespace: easyshop
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: db-migration

    spec:
      restartPolicy: Never

      containers:
        - name: db-migration
          image: aakash969/e-commerce-migration:90974e302c5703746e0fc3ff358ee6228b00f49c
          imagePullPolicy: Always

          envFrom:
            - configMapRef:
                name: easyshop-config

            - secretRef:
                name: easyshop-secrets