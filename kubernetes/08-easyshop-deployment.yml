apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyshop
  namespace: easyshop

spec:
  replicas: 2

  selector:
    matchLabels:
      app: easyshop

  template:
    metadata:
      labels:
        app: easyshop

    spec:
      containers:
        - name: easyshop

          image: aakash969/e-commerce-app:2560f31dae9df9f502a30a05717c6407c7d37442
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: HOSTNAME
              value: "0.0.0.0"

            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: easyshop-config
                  key: NEXTAUTH_URL

            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: easyshop-secrets
                  key: NEXTAUTH_SECRET

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: easyshop-secrets
                  key: JWT_SECRET

          envFrom:
            - configMapRef:
                name: easyshop-config

            - secretRef:
                name: easyshop-secrets

          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"

            limits:
              memory: "512Mi"
              cpu: "500m"

          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 25
            periodSeconds: 20